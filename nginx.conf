server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康检查：不依赖任何后端或外部服务
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "ok\n";
    }

    # 静态资源长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 单页应用（无后端路由，全部为本地静态内容）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
