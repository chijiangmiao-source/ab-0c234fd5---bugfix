services:
  # 纯静态复核页：nginx 托管 React 构建产物，提供 /healthz 健康检查
  web:
    build:
      context: .
      target: runtime
    image: nanopore-review-web:latest
    ports:
      # 宿主机端口可配置：在 .env 或环境变量中设置 WEB_PORT（默认 8080）
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # 一次性验收：单元测试 → 构建检查 → HTTP 冒烟；自行退出并以退出码报告结果
  verify:
    build:
      context: .
      target: builder
    image: nanopore-review-verify:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web
    command:
      - sh
      - -c
      - "npm test && npm run build && sh scripts/smoke.sh"
    restart: "no"
